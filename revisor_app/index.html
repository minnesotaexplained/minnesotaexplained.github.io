<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Bills Explorer</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* "Light" mode — semi-dark slate */
        :root {
            --bg-primary: #1e2433;
            --bg-secondary: #252d3d;
            --bg-tertiary: #2a3347;
            --text-primary: #dce4f0;
            --text-secondary: #90a4be;
            --text-tertiary: #6b82a0;
            --text-quaternary: #56708a;
            --border-primary: #2e3d55;
            --border-secondary: #2e3d55;
            --border-tertiary: #2e3d55;
            --accent-primary: #5b9bd5;
            --accent-secondary: #1e3c72;
            --accent-tertiary: #667eea;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.35);
            --hover-bg: #253045;
            --table-hover: #253045;
            --diff-add-bg: rgba(46, 160, 67, 0.18);
            --diff-add-text: #4fae63;
            --diff-del-bg: rgba(248, 81, 73, 0.18);
            --diff-del-text: #d9534f;
        }

        /* Dark mode — deeper charcoal */
        [data-theme="dark"] {
            --bg-primary: #0f1117;
            --bg-secondary: #161b27;
            --bg-tertiary: #1a2030;
            --text-primary: #e2e8f0;
            --text-secondary: #8898aa;
            --text-tertiary: #637080;
            --text-quaternary: #4a5568;
            --border-primary: #1e2a3a;
            --border-secondary: #1e2a3a;
            --border-tertiary: #1e2a3a;
            --accent-primary: #4299e1;
            --accent-secondary: #2b6cb0;
            --accent-tertiary: #667eea;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.6);
            --hover-bg: #161b27;
            --table-hover: #161b27;
            --diff-add-bg: rgba(46, 160, 67, 0.15);
            --diff-add-text: #56d364;
            --diff-del-bg: rgba(248, 81, 73, 0.15);
            --diff-del-text: #ff7b72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
            color: white;
            padding: 20px 40px;
            box-shadow: var(--shadow-md);
            top: 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        [data-theme="dark"] .navbar {
            background: #0a0d14;
            border-bottom: 1px solid #1e2a3a;
        }

        .mx-logo {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 5px 9px;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .mx-logo:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .back-button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--accent-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-button:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        .navbar-content {
            flex: 1;
        }

        .navbar-title {
            font-size: 1.3em;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .navbar-subtitle {
            font-size: 1em;
            opacity: 0.9;
            margin: 0;
        }

        /* Dark Mode Toggle */
        .dark-mode-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .toggle-switch:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .toggle-slider::before {
            content: '☀️';
        }

        [data-theme="dark"] .toggle-slider {
            transform: translateX(30px);
        }

        [data-theme="dark"] .toggle-slider::before {
            content: '🌙';
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 30px 60px;
        }

        .page-intro {
            margin-bottom: 24px;
        }

        .page-intro h1 {
            font-size: 1.6rem;
            margin: 0 0 6px 0;
            color: var(--text-primary);
        }

        .page-intro p {
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-box input::placeholder {
            color: var(--text-tertiary);
        }

        select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }

        .result-count {
            color: var(--text-tertiary);
            font-size: 13px;
            margin-bottom: 10px;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: var(--bg-secondary);
        }

        thead {
            background: var(--bg-tertiary);
        }

        th {
            padding: 14px 15px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-tertiary);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border-tertiary);
            vertical-align: top;
        }

        tbody tr {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--table-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .bill-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .bill-sub {
            color: var(--text-tertiary);
            font-size: 12px;
            margin-top: 2px;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-secondary);
            white-space: nowrap;
        }

        .chamber-tag {
            display: inline-block;
            background: var(--bg-tertiary);
            color: var(--accent-tertiary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid var(--border-secondary);
            white-space: nowrap;
            margin-right: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-tertiary);
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .page-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--accent-primary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-btn:not(:disabled):hover {
            background: var(--hover-bg);
        }

        /* Detail panel */
        .detail-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 12px;
            margin: 20px 0 6px 0;
        }

        .detail-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 24px;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .detail-meta .dot {
            opacity: 0.5;
        }

        .detail-section {
            margin-bottom: 32px;
        }

        .detail-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            margin: 0 0 14px 0;
            font-weight: 600;
        }

        .prose {
            color: var(--text-secondary);
            line-height: 1.75;
        }

        .prose a {
            color: var(--accent-primary);
        }

        .chambers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .chamber-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 16px 20px;
        }

        .chamber-card h4 {
            margin: 0 0 10px 0;
            color: var(--accent-tertiary);
            font-size: 1rem;
        }

        .chamber-card .field-label {
            color: var(--text-tertiary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .authors-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .author-chip {
            display: inline-block;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .author-chip a {
            color: inherit;
            text-decoration: none;
        }

        .author-chip a:hover {
            color: var(--accent-primary);
        }

        .actions-timeline {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .actions-timeline li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-tertiary);
            font-size: 13px;
            display: flex;
            gap: 12px;
        }

        .actions-timeline li:last-child {
            border-bottom: none;
        }

        .actions-timeline .action-date {
            color: var(--text-tertiary);
            white-space: nowrap;
            min-width: 80px;
        }

        .actions-timeline .action-text {
            color: var(--text-secondary);
        }

        .actions-timeline a {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 12px;
        }

        .bill-text-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .bill-text-tab {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .bill-text-tab.active {
            color: white;
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
        }

        .diff-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            overflow: hidden;
        }

        .diff-box-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-primary);
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .diff-legend {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .diff-legend .swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            display: inline-block;
        }

        .diff-legend .swatch.add {
            background: var(--diff-add-text);
        }

        .diff-legend .swatch.del {
            background: var(--diff-del-text);
        }

        .diff-content {
            padding: 18px 24px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13.5px;
            line-height: 1.85;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .diff-content del {
            background: var(--diff-del-bg);
            color: var(--diff-del-text);
            text-decoration: line-through;
            text-decoration-thickness: 1px;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .diff-content ins {
            background: var(--diff-add-bg);
            color: var(--diff-add-text);
            text-decoration: none;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .loading, .error {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-tertiary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-primary);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-quaternary);
            font-size: 13px;
            border-top: 1px solid var(--border-tertiary);
        }

        /* Tabs */
        .view-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-primary);
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .view-tab {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .view-tab:hover { color: var(--text-primary); }

        .view-tab.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        /* Stage badges */
        .stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            color: var(--text-secondary);
        }

        .stage-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--stage-color, var(--text-tertiary));
        }

        .chamber-card .stage-badge {
            margin-bottom: 12px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-secondary);
            color: white;
            border-radius: 16px;
            padding: 6px 8px 6px 14px;
            font-size: 13px;
            margin-bottom: 12px;
            margin-right: 8px;
        }

        .filter-chip button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            line-height: 1;
        }

        /* Swimlane board */
        .board-scroll {
            overflow-x: auto;
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            background: var(--bg-secondary);
            box-shadow: var(--shadow-md);
        }

        .board {
            display: grid;
            grid-template-columns: 120px repeat(8, minmax(118px, 1fr));
            min-width: 1080px;
        }

        .board-colhead {
            padding: 12px 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            border-bottom: 2px solid var(--accent-tertiary);
            background: var(--bg-tertiary);
        }

        .board-colhead .step {
            display: block;
            color: var(--accent-primary);
            font-size: 10px;
            margin-bottom: 2px;
        }

        .lane-label {
            padding: 14px 12px;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-primary);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lane-label small {
            font-weight: 400;
            color: var(--text-tertiary);
            font-size: 11px;
            margin-top: 2px;
        }

        .lane-slot {
            border-bottom: 1px solid var(--border-primary);
            padding: 10px 6px;
            position: relative;
            display: flex;
            align-items: stretch;
        }

        /* faint track running through each lane */
        .lane-slot::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px dashed var(--border-primary);
        }

        .stage-cell {
            position: relative;
            flex: 1;
            border-radius: 8px;
            border: 1px solid var(--border-secondary);
            background: var(--bg-primary);
            padding: 10px 10px 12px;
            cursor: pointer;
            text-align: left;
            color: var(--text-primary);
            font: inherit;
            transition: border-color 0.15s ease, transform 0.15s ease;
            overflow: hidden;
        }

        .stage-cell:hover { border-color: var(--accent-primary); }

        .stage-cell.selected {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-primary);
        }

        .stage-cell.empty { opacity: 0.5; }

        .stage-cell .fill {
            position: absolute;
            inset: 0;
            background: var(--stage-color);
            opacity: var(--fill, 0);
            pointer-events: none;
        }

        .stage-cell .count {
            position: relative;
            font-size: 1.35rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stage-cell .label {
            position: relative;
            display: block;
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.3;
        }

        .stage-cell .sub {
            position: relative;
            display: block;
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .offramps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .offramps .stage-cell {
            flex: 0 1 230px;
        }

        .board-note {
            color: var(--text-tertiary);
            font-size: 12.5px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .section-heading {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 28px 0 12px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 1.15rem;
        }

        /* Legislators */
        .seg {
            display: inline-flex;
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            overflow: hidden;
        }

        .seg button {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .seg button.active {
            background: var(--accent-secondary);
            color: white;
        }

        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--accent-primary); }
        th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

        .bar-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }

        .bar-track {
            width: 110px;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .bar-track span {
            display: block;
            height: 100%;
            background: var(--accent-primary);
            border-radius: 4px;
        }

        .rank { color: var(--text-tertiary); width: 36px; }

        .party-badge {
            display: inline-block;
            min-width: 38px;
            text-align: center;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--party-color);
            border: 1px solid var(--party-color);
            background: color-mix(in srgb, var(--party-color) 14%, transparent);
        }

        .party-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .party-card {
            flex: 1 1 320px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 16px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-left: 3px solid var(--party-color);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .party-card b { color: var(--text-primary); }

        /* Committees */
        .cm-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
            margin-bottom: 28px;
        }

        .cm-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            padding: 16px 18px;
        }

        .cm-map-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px 16px;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .cm-map-head h2 { margin: 0; font-size: 1.05rem; }
        .cm-map-head .bill-sub { margin: 0; }

        .seat-bar {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: var(--bg-tertiary);
            margin: 6px 0 4px;
        }

        .seat-bar span { display: block; height: 100%; }

        .seat-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .hex-map svg {
            display: block;
            width: 100%;
            max-height: 620px;
            margin: 8px auto 0;
        }

        .hex-tile { cursor: pointer; }
        .hex-tile polygon { transition: fill 0.15s ease, opacity 0.15s ease; }
        .hex-tile text {
            font-size: 0.26px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            fill: #fff;
        }
        .hex-tile.off polygon { opacity: 0.16; }
        .hex-tile.off text { fill: var(--text-tertiary); }
        .hex-tile:hover polygon, .hex-tile.picked polygon { stroke: var(--text-primary) !important; stroke-width: 0.1 !important; }
        .hex-tile.picked polygon { opacity: 1; }

        .hex-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .hex-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .hex-legend svg { width: 14px; height: 14px; }

        .hex-tip {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 10px 12px;
            font-size: 12.5px;
            color: var(--text-secondary);
            max-width: 280px;
            line-height: 1.5;
        }

        .hex-tip b { color: var(--text-primary); }

        .cm-panel { position: sticky; top: 16px; }
        .cm-panel h2 { margin: 0 0 4px; font-size: 1.15rem; }
        .cm-panel .back-button { margin-bottom: 12px; padding: 4px 10px; font-size: 12px; }

        .cm-panel-empty {
            color: var(--text-tertiary);
            font-size: 13.5px;
            line-height: 1.7;
        }

        .cm-panel-empty b { color: var(--text-secondary); }

        .cm-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .cm-stat {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 10px;
        }

        .cm-stat b {
            display: block;
            font-size: 1.3rem;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .cm-stat span { font-size: 11.5px; color: var(--text-tertiary); }

        .roster { list-style: none; margin: 10px 0 0; padding: 0; }

        .roster li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 6px;
            border-bottom: 1px solid var(--border-tertiary);
            font-size: 13.5px;
            cursor: pointer;
            border-radius: 4px;
        }

        .roster li:last-child { border-bottom: none; }
        .roster li:hover, .roster li.hot { background: var(--hover-bg); }
        .roster .who { flex: 1; min-width: 0; }
        .roster .who .bill-sub { margin: 0; }

        .role-tag {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-primary);
            white-space: nowrap;
        }

        .roster-group {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            font-weight: 600;
            margin-top: 16px;
        }

        .cm-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 14px;
            font-size: 13px;
        }

        .cm-links a, .cm-links button {
            color: var(--accent-primary);
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
        }

        .next-note {
            margin-top: 12px;
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .cm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .cm-tile {
            text-align: left;
            font: inherit;
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .cm-tile:hover { border-color: var(--accent-primary); }
        .cm-tile.selected { border-color: var(--accent-primary); box-shadow: 0 0 0 2px var(--accent-primary); }
        .cm-tile .name { font-weight: 600; line-height: 1.35; }
        .cm-tile .sub-kind { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }
        .cm-tile .chairs { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .cm-tile .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-tertiary); margin-top: 8px; }
        .cm-tile .seat-bar { height: 6px; margin: 6px 0 0; }

        @media (max-width: 1000px) {
            .cm-layout { grid-template-columns: 1fr; }
            .cm-panel { position: static; }
        }

        @media (max-width: 768px) {
            .bar-track { width: 50px; }
            .navbar {
                padding: 15px 20px;
            }

            .navbar-title {
                font-size: 1.15em;
            }

            .navbar-subtitle {
                font-size: 0.85em;
            }

            .container {
                padding: 0 16px 40px;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 10px;
            }

            .col-optional {
                display: none;
            }

            .diff-content {
                padding: 14px 16px;
                font-size: 12.5px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <a href="../index.html" class="mx-logo">MX</a>
            <div class="navbar-content">
                <h1 class="navbar-title">MN Bills Explorer</h1>
                <p class="navbar-subtitle">Minnesota Explained — Legislature Bill Tracker (Session 94)</p>
            </div>
            <div class="dark-mode-toggle">
                <div class="toggle-switch" @click="toggleDarkMode">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </nav>

        <div class="container">
            <div v-if="loading" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading bills…</p>
            </div>

            <div v-else-if="error" class="error">
                <p>Could not load bill data — {{ error }}</p>
            </div>

            <template v-else>
                <div class="view-tabs" v-if="view !== 'detail'">
                    <button class="view-tab" :class="{ active: view === 'list' }" @click="go('bills')">Bills</button>
                    <button class="view-tab" :class="{ active: view === 'pipeline' }" @click="go('pipeline')">Pipeline</button>
                    <button class="view-tab" :class="{ active: view === 'legislators' }" @click="go('legislators')">Legislators</button>
                    <button class="view-tab" :class="{ active: view === 'committees' }" @click="go('committees')">Committees</button>
                </div>

                <div v-if="view === 'list'">
                    <div class="page-intro">
                        <h1>Minnesota Bills, 94th Legislature</h1>
                        <p>Search and browse every House and Senate bill from the 2025–2026 session, pulled from the Office of the Revisor of Statutes.</p>
                    </div>

                    <div v-if="authorFilter">
                        <span class="filter-chip">
                            Authored by {{ legislatorLabel(authorFilter) }}
                            <button @click="authorFilter = ''" aria-label="Clear author filter">×</button>
                        </span>
                    </div>

                    <div class="controls">
                        <div class="search-box">
                            <input
                                type="text"
                                v-model="search"
                                placeholder="Search by bill number, description, author, or revisor number…"
                            />
                        </div>
                        <select v-model="sessionFilter">
                            <option value="">All sessions</option>
                            <option v-for="s in sessions" :key="s" :value="s">{{ s }}</option>
                        </select>
                        <select v-model="chamberFilter">
                            <option value="">House &amp; Senate</option>
                            <option value="house">House only</option>
                            <option value="senate">Senate only</option>
                            <option value="both">Companion bills (both)</option>
                        </select>
                        <select v-model="stageFilter">
                            <option value="">Any stage</option>
                            <option v-for="s in stageOptions" :key="s" :value="s">{{ STAGES[s].label }}</option>
                        </select>
                    </div>

                    <div class="result-count">
                        {{ filteredBills.length.toLocaleString() }} bill{{ filteredBills.length === 1 ? '' : 's' }} found
                    </div>

                    <div class="table-wrapper">
                        <table v-if="pagedBills.length > 0">
                            <thead>
                                <tr>
                                    <th>Bill</th>
                                    <th>Description</th>
                                    <th class="col-optional">Session</th>
                                    <th>Stage</th>
                                    <th class="col-optional">Latest Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    v-for="b in pagedBills"
                                    :key="b.revisor_number"
                                    @click="go('bill/' + b.revisor_number)"
                                >
                                    <td>
                                        <div class="bill-title">
                                            <span v-if="b.house_bill" class="chamber-tag">{{ b.house_bill }}</span>
                                            <span v-if="b.senate_bill" class="chamber-tag">{{ b.senate_bill }}</span>
                                        </div>
                                        <div class="bill-sub">{{ b.revisor_number }}</div>
                                    </td>
                                    <td>{{ b.description || '—' }}</td>
                                    <td class="col-optional">
                                        <span class="status-badge">{{ b.session }}</span>
                                    </td>
                                    <td>
                                        <span v-if="b.stage" class="stage-badge" :style="{ '--stage-color': STAGES[b.stage].color }">{{ STAGES[b.stage].short }}</span>
                                        <span v-else class="bill-sub">Resolution</span>
                                    </td>
                                    <td class="col-optional">
                                        <div>{{ b.latest_action && b.latest_action.text }}</div>
                                        <div class="bill-sub">{{ b.latest_action && b.latest_action.date }}</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div v-else class="empty-state">No bills match your search.</div>
                    </div>

                    <div class="pagination" v-if="totalPages > 1">
                        <button class="page-btn" :disabled="page === 1" @click="page--">← Prev</button>
                        <span>Page {{ page }} of {{ totalPages }}</span>
                        <button class="page-btn" :disabled="page === totalPages" @click="page++">Next →</button>
                    </div>
                </div>

                <div v-else-if="view === 'pipeline'">
                    <div class="page-intro">
                        <h1>Where every bill stands</h1>
                        <p>Each lane is a body a bill has to get through. Bills start in committee in their chamber of origin, cross to the other chamber, reconcile any differences, and go to the governor. Select a stage to list the bills sitting there.</p>
                    </div>

                    <div class="controls">
                        <select v-model="pipelineSession">
                            <option value="">All sessions</option>
                            <option v-for="s in sessions" :key="s" :value="s">{{ s }}</option>
                        </select>
                    </div>

                    <div class="board-scroll">
                        <div class="board">
                            <div class="board-colhead"></div>
                            <div class="board-colhead" v-for="(c, i) in BOARD_COLUMNS" :key="c">
                                <span class="step">Step {{ i + 1 }}</span>{{ c }}
                            </div>
                            <template v-for="lane in BOARD_LANES" :key="lane.id">
                                <div class="lane-label">{{ lane.label }}<small>{{ lane.sub }}</small></div>
                                <div class="lane-slot" v-for="col in 8" :key="lane.id + col">
                                    <button
                                        v-if="laneCell(lane, col)"
                                        class="stage-cell"
                                        :class="{ selected: selectedCell === laneCell(lane, col).key, empty: !cellCount(laneCell(lane, col).key) }"
                                        :style="cellStyle(laneCell(lane, col))"
                                        @click="selectCell(laneCell(lane, col).key)"
                                    >
                                        <span class="fill"></span>
                                        <span class="count">{{ cellCount(laneCell(lane, col).key).toLocaleString() }}</span>
                                        <span class="label">{{ laneCell(lane, col).label }}</span>
                                        <span class="sub" v-if="laneCell(lane, col).sub">{{ cellSub(laneCell(lane, col)) }}</span>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="offramps">
                        <button
                            v-for="c in OFFRAMP_CELLS"
                            :key="c.key"
                            class="stage-cell"
                            :class="{ selected: selectedCell === c.key, empty: !cellCount(c.key) }"
                            :style="cellStyle(c)"
                            @click="selectCell(c.key)"
                        >
                            <span class="fill"></span>
                            <span class="count">{{ cellCount(c.key).toLocaleString() }}</span>
                            <span class="label">{{ c.label }}</span>
                            <span class="sub">{{ c.sub }}</span>
                        </button>
                    </div>

                    <p class="board-note">
                        Counts are House Files and Senate Files, counted separately: companion bills move through both chambers in parallel, and usually only one of the pair goes all the way. Resolutions are not included.
                        Data runs through {{ lastActionDate }}; the 94th Legislature has adjourned, so a bill not signed into law did not pass this biennium.
                    </p>

                    <div v-if="selectedCell">
                        <div class="section-heading">
                            <h2>{{ cellLabel(selectedCell) }}</h2>
                            <span class="result-count">{{ cellFiles.length.toLocaleString() }} file{{ cellFiles.length === 1 ? '' : 's' }}</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Description</th>
                                        <th class="col-optional">Latest Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="f in pagedCellFiles" :key="f.file.n" @click="go('bill/' + f.bill.revisor_number)">
                                        <td>
                                            <div class="bill-title"><span class="chamber-tag">{{ f.file.n }}</span></div>
                                            <div class="bill-sub">{{ companionOf(f) ? 'Companion ' + companionOf(f) : f.bill.revisor_number }}</div>
                                        </td>
                                        <td>{{ f.bill.description || '—' }}</td>
                                        <td class="col-optional">
                                            <div>{{ f.bill.latest_action && f.bill.latest_action.text }}</div>
                                            <div class="bill-sub">{{ f.bill.latest_action && f.bill.latest_action.date }}</div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination" v-if="cellPages > 1">
                            <button class="page-btn" :disabled="cellPage === 1" @click="cellPage--">← Prev</button>
                            <span>Page {{ cellPage }} of {{ cellPages }}</span>
                            <button class="page-btn" :disabled="cellPage === cellPages" @click="cellPage++">Next →</button>
                        </div>
                    </div>
                </div>

                <div v-else-if="view === 'legislators'">
                    <div class="page-intro">
                        <h1>Who's authoring the most</h1>
                        <p>Authorship across every House and Senate file this biennium. The chief author is the legislator listed first on a bill. "Passed a chamber" and "Became law" count chief-authored bills where the bill or its companion got that far.</p>
                    </div>

                    <div class="controls">
                        <div class="seg">
                            <button :class="{ active: legChamber === 'house' }" @click="legChamber = 'house'">House ({{ legCount('house') }})</button>
                            <button :class="{ active: legChamber === 'senate' }" @click="legChamber = 'senate'">Senate ({{ legCount('senate') }})</button>
                        </div>
                        <div class="seg">
                            <button :class="{ active: legParty === '' }" @click="legParty = ''">All parties</button>
                            <button v-for="p in PARTIES" :key="p" :class="{ active: legParty === p }" @click="legParty = p">{{ p }}</button>
                        </div>
                        <div class="search-box">
                            <input type="text" v-model="legSearch" placeholder="Search by name or district…" />
                        </div>
                    </div>

                    <div class="party-summary" v-if="partySummary.length">
                        <div class="party-card" v-for="p in partySummary" :key="p.party" :style="{ '--party-color': partyColor(p.party) }">
                            <span class="party-badge">{{ p.party }}</span>
                            <span><b>{{ p.members }}</b> members</span>
                            <span><b>{{ p.chief.toLocaleString() }}</b> bills as chief author <span class="bill-sub">({{ p.perMember }} per member)</span></span>
                            <span><b>{{ p.law }}</b> became law</span>
                        </div>
                    </div>

                    <div v-if="legLoading" class="loading"><div class="loading-spinner"></div><p>Loading legislators…</p></div>
                    <div v-else-if="legError" class="error"><p>Could not load legislators — {{ legError }}</p></div>
                    <div v-else class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-optional">#</th>
                                    <th class="sortable" @click="sortLeg('name')">Legislator {{ sortArrow('name') }}</th>
                                    <th class="sortable" @click="sortLeg('party')">Party {{ sortArrow('party') }}</th>
                                    <th class="sortable num" @click="sortLeg('chief')">Chief author {{ sortArrow('chief') }}</th>
                                    <th class="sortable num col-optional" @click="sortLeg('coauthor')">Co-author {{ sortArrow('coauthor') }}</th>
                                    <th class="sortable num col-optional" @click="sortLeg('total')">Total {{ sortArrow('total') }}</th>
                                    <th class="sortable num col-optional" @click="sortLeg('chief_passed')">Passed a chamber {{ sortArrow('chief_passed') }}</th>
                                    <th class="sortable num" @click="sortLeg('chief_law')">Became law {{ sortArrow('chief_law') }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(l, i) in sortedLegislators" :key="l.key" @click="showAuthor(l.key)">
                                    <td class="rank col-optional">{{ i + 1 }}</td>
                                    <td>
                                        <div class="bill-title">{{ l.name }}</div>
                                        <div class="bill-sub">
                                            <template v-if="l.full_name">{{ l.full_name }} · </template>
                                            <template v-if="l.district">District {{ l.district }} · </template>
                                            <a v-if="l.url" :href="l.url" target="_blank" rel="noopener" @click.stop style="color: inherit">Profile ↗</a>
                                        </div>
                                    </td>
                                    <td>
                                        <span v-if="l.party" class="party-badge" :style="{ '--party-color': partyColor(l.party) }">{{ l.party }}</span>
                                        <span v-else class="bill-sub">—</span>
                                    </td>
                                    <td class="num">
                                        <div class="bar-cell">
                                            {{ l.chief }}
                                            <span class="bar-track"><span :style="{ width: (100 * l.chief / maxChief) + '%' }"></span></span>
                                        </div>
                                    </td>
                                    <td class="num col-optional">{{ l.coauthor }}</td>
                                    <td class="num col-optional">{{ l.total }}</td>
                                    <td class="num col-optional">{{ l.chief_passed }}</td>
                                    <td class="num">{{ l.chief_law }}</td>
                                </tr>
                            </tbody>
                        </table>
                        <div v-if="sortedLegislators.length === 0" class="empty-state">No legislators match your search.</div>
                    </div>
                </div>

                <div v-else-if="view === 'committees'">
                    <div class="page-intro">
                        <h1>Who sits on what</h1>
                        <p>Every standing committee in the House and Senate for the 2025–2026 session, and its members. Pick a committee to light up its members on the map, or pick a district to see that legislator's assignments.</p>
                    </div>

                    <div v-if="cmLoading" class="loading"><div class="loading-spinner"></div><p>Loading committees…</p></div>
                    <div v-else-if="cmError" class="error"><p>Could not load committees — {{ cmError }}</p></div>
                    <template v-else-if="cm">
                        <div class="controls">
                            <div class="seg">
                                <button :class="{ active: cmChamber === 'house' }" @click="go('committees/house')">House ({{ cmCommitteeCount('house') }})</button>
                                <button :class="{ active: cmChamber === 'senate' }" @click="go('committees/senate')">Senate ({{ cmCommitteeCount('senate') }})</button>
                            </div>
                            <div class="search-box">
                                <input type="text" v-model="cmSearch" placeholder="Find a committee or legislator…" />
                            </div>
                        </div>

                        <div class="cm-layout">
                            <div class="cm-card hex-map">
                                <div class="cm-map-head">
                                    <h2>{{ cmChamber === 'house' ? 'House of Representatives' : 'State Senate' }}</h2>
                                    <p class="bill-sub">One hexagon per district, placed roughly where it is on the map</p>
                                </div>
                                <div class="seat-bar">
                                    <span v-for="p in cmPartySeats" :key="p.party" :style="{ width: (100 * p.n / cmSeatTotal) + '%', background: partyColor(p.party) }"></span>
                                </div>
                                <div class="seat-bar-label">
                                    <span v-for="p in cmPartySeats" :key="p.party" :style="{ color: partyColor(p.party) }"><b>{{ p.n }}</b> {{ p.party }}</span>
                                </div>
                                <svg v-if="cmTiles.length" v-bind="{ viewBox: cmViewBox }" preserveAspectRatio="xMidYMid meet"
                                     role="img" :aria-label="(cmChamber === 'house' ? 'House' : 'Senate') + ' seats, one hexagon per district'">
                                    <g v-for="t in cmTiles" :key="t.key" class="hex-tile" :class="cmTileClass(t)"
                                       @mouseenter="cmHover(t, $event)" @mousemove="cmMoveTip($event)" @mouseleave="cmUnhover"
                                       @click="go('committees/' + t.key)">
                                        <polygon :points="t.points" :style="{ fill: partyColor(t.seat && t.seat.party),
                                                 stroke: cmIsLead(t) ? 'var(--text-primary)' : 'var(--bg-secondary)',
                                                 strokeWidth: cmIsLead(t) ? 0.09 : 0.04 }"/>
                                        <text :x="t.x" :y="t.y">{{ t.label }}</text>
                                    </g>
                                </svg>
                                <div class="hex-legend">
                                    <span v-for="p in PARTIES" :key="p"><svg viewBox="-1 -1 2 2"><polygon :points="HEX_ICON" :style="{ fill: partyColor(p) }"/></svg>{{ p }}</span>
                                    <template v-if="cmSelCommittee">
                                        <span><svg viewBox="-1 -1 2 2"><polygon :points="HEX_ICON" style="fill: var(--text-tertiary); stroke: var(--text-primary); stroke-width: 0.3"/></svg>Chair, vice chair, or lead</span>
                                        <span><svg viewBox="-1 -1 2 2"><polygon :points="HEX_ICON" style="fill: var(--text-tertiary); opacity: 0.25"/></svg>Not on this committee</span>

                            <div class="cm-card cm-panel">
                                <!-- Committee -->
                                <template v-if="cmSelCommittee">
                                    <button class="back-button" @click="go('committees/' + cmChamber)">× Clear</button>

                                    <div class="seat-bar">
                                        <span v-for="p in cmCommitteeParties(cmSelCommittee)" :key="p.party" :style="{ width: (100 * p.n / cmSelCommittee.members.length) + '%', background: partyColor(p.party) }"></span>
                                    </div>
                                    <div class="seat-bar-label">
                                        <span>{{ cmSelCommittee.members.length }} members</span>
                                        <span><template v-for="(p, i) in cmCommitteeParties(cmSelCommittee)" :key="p.party"><template v-if="i"> · </template><span :style="{ color: partyColor(p.party) }">{{ p.n }} {{ p.party }}</span></template></span>
                                    </div>
                                    <template v-for="grp in cmRosterGroups(cmSelCommittee)" :key="grp.label">
                                        <div class="roster-group">{{ grp.label }}</div>
                                        <ul class="roster">
                                            <li v-for="m in grp.members" :key="m.district" :class="{ hot: cmHoverKey === cmChamber + ':' + m.district }"

                                                @click="go('committees/' + cmChamber + ':' + m.district)">
                                                <span class="party-badge" :style="{ '--party-color': partyColor(m.party) }">{{ m.party }}</span>
                                                <span class="who">{{ m.name }} <span class="bill-sub">· District {{ m.district.replace(/^0/, '') }}</span></span>

                                    </template>
                                    <div class="cm-links">
                                        <a :href="cmSelCommittee.url" target="_blank" rel="noopener">Committee page ↗</a>
                                    </div>

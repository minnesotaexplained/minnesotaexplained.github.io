                                <!-- Legislator -->
                                <template v-else-if="cmSelSeat">
                                    <button class="back-button" @click="go('committees/' + cmChamber)">× Clear</button>
                                    <h2>{{ cmChamber === 'house' ? 'Rep.' : 'Sen.' }} {{ cmSelSeat.name }}</h2>
                                    <div class="detail-meta" style="margin-bottom: 4px">
                                        <span class="party-badge" :style="{ '--party-color': partyColor(cmSelSeat.party) }">{{ cmSelSeat.party }}</span>
                                        <span>District {{ cmSelSeat.district.replace(/^0/, '') }}</span>
                                    </div>
                                    <div class="roster-group">{{ cmSelSeat.committees.length ? cmSelSeat.committees.length + ' committee' + (cmSelSeat.committees.length === 1 ? '' : 's') : 'Committees' }}</div>
                                    <ul class="roster" v-if="cmSelSeat.committees.length">
                                        <li v-for="c in cmSeatCommittees(cmSelSeat)" :key="c.id" @click="go('committees/' + c.id)">
                                            <span class="who">{{ c.name }}</span>
                                            <span class="role-tag" v-if="c.role !== 'Member'">{{ c.role }}</span>
                                        </li>
                                    </ul>
                                    <p v-else class="cm-panel-empty">Not listed on any {{ cmChamber === 'house' ? 'House' : 'Senate' }} committee roster.</p>
                                    <div class="next-note" v-if="cmSelSeat.next">
                                        2026 election:
                                        <template v-if="cmSamePerson(cmSelSeat.next.name, cmSelSeat.name)">re-elected.</template>
                                        <template v-else>seat won by <b>{{ cmSelSeat.next.name }}</b> ({{ cmSelSeat.next.party }}){{ cmSelSeat.next.flip ? ', a party flip' : '' }}. New committee assignments come with the 2027 session.</template>
                                    </div>
                                    <div class="cm-links">
                                        <button v-if="cmSelSeat.key && legislatorsByKey[cmSelSeat.key]" @click="showAuthor(cmSelSeat.key)">Bills authored ({{ legislatorsByKey[cmSelSeat.key].chief }} as chief) →</button>
                                        <a v-if="cmSelSeat.url" :href="cmSelSeat.url" target="_blank" rel="noopener">Profile ↗</a>
                                    </div>
                                </template>

                                <!-- Nothing selected -->
                                <template v-else>
                                    <h2>{{ cmChamber === 'house' ? 'House' : 'Senate' }} committees</h2>
                                    <p class="cm-panel-empty">
                                        <template v-if="cmChamber === 'house'">Under this session's power-sharing agreement, each House committee has <b>co-chairs</b>, one from each party.</template>
                                        <template v-else>Senate committees have a <b>chair</b> and <b>vice chair</b> from the majority, and a <b>ranking minority member</b> who leads the other party's side.</template>
                                        Select a committee below, or a hexagon on the map.
                                    </p>
                                    <div class="cm-stats">
                                        <div class="cm-stat"><b>{{ cmCommitteeCount(cmChamber) }}</b><span>committees &amp; subcommittees</span></div>
                                        <div class="cm-stat"><b>{{ cmAvgSize }}</b><span>members per committee</span></div>
                                        <div class="cm-stat"><b>{{ cmAvgLoad }}</b><span>assignments per legislator</span></div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="section-heading">
                            <h2>{{ cmChamber === 'house' ? 'House' : 'Senate' }} committees</h2>
                            <span class="result-count">{{ cmFiltered.length }} shown<template v-if="cmSearch.trim()"> · matching “{{ cmSearch.trim() }}”</template></span>
                        </div>
                        <div class="cm-grid">
                            <button v-for="c in cmFiltered" :key="c.id" class="cm-tile" :class="{ selected: cmSel === c.id }" @click="go('committees/' + (cmSel === c.id ? cmChamber : c.id))">
                                <div class="name">{{ c.name }} <span class="sub-kind" v-if="c.kind === 'subcommittee'">· {{ /division/i.test(c.name) ? 'Division' : 'Subcommittee' }}</span></div>
                                <div class="chairs">{{ cmChairLine(c) }}</div>
                                <div class="seat-bar">
                                    <span v-for="p in cmCommitteeParties(c)" :key="p.party" :style="{ width: (100 * p.n / c.members.length) + '%', background: partyColor(p.party) }"></span>
                                </div>
                                <div class="meta">
                                    <span>{{ c.members.length }} members</span>
                                    <span v-if="cmSearchHits(c)">{{ cmSearchHits(c) }}</span>
                                </div>
                            </button>
                        </div>
                        <div v-if="!cmFiltered.length" class="empty-state">No committees match your search.</div>
                        <p class="board-note">Rosters from the <a :href="cm.sources.house" target="_blank" rel="noopener" style="color: inherit">House</a> and <a :href="cm.sources.senate" target="_blank" rel="noopener" style="color: inherit">Senate</a> committee pages, retrieved {{ cmScrapedAt }}. Members are current through the end of the 2025–2026 session; committees for the 2027 session haven't been named yet.</p>

                        <div class="hex-tip" v-if="cmTip" :style="{ left: cmTipPos.x + 'px', top: cmTipPos.y + 'px' }">
                            <b>{{ cmTip.seat ? cmTip.seat.name : 'Vacant' }}</b> <span v-if="cmTip.seat">({{ cmTip.seat.party }})</span><br>
                            District {{ cmTip.label }}<template v-if="cmTip.seat"> · {{ cmTip.seat.committees.length }} committee{{ cmTip.seat.committees.length === 1 ? '' : 's' }}</template>
                            <div v-if="cmSelCommittee && cmTip.role">{{ cmTip.role === 'Member' ? 'Member' : cmTip.role }} of {{ cmSelCommittee.name }}</div>
                            <div v-else-if="cmSelCommittee" style="opacity: 0.7">Not on this committee</div>
                        </div>
                    </template>
                </div>

                <div class="detail-panel" v-else-if="view === 'detail'">
                    <button class="back-button" @click="goBack">← Back</button>

                    <div v-if="detailLoading" class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading bill…</p>
                    </div>
                    <div v-else-if="detailError" class="error">
                        <p>Could not load bill — {{ detailError }}</p>
                    </div>
                    <template v-else-if="selectedBill">
                        <div class="detail-header">
                            <h2>{{ selectedBill.house ? selectedBill.house.bill_number : selectedBill.senate.bill_number }}<span v-if="selectedBill.house && selectedBill.senate"> / {{ selectedBill.senate.bill_number }}</span></h2>
                            <span class="status-badge">{{ selectedBill.session }}</span>
                        </div>
                        <div class="detail-meta">
                            <span>{{ selectedBill.revisor_number }}</span>
                            <span class="dot">·</span>
                            <span>{{ selectedBill.latest_action && selectedBill.latest_action.text }}</span>
                            <span class="dot" v-if="selectedBill.latest_action && selectedBill.latest_action.date">·</span>
                            <span v-if="selectedBill.latest_action && selectedBill.latest_action.date">{{ selectedBill.latest_action.date }}</span>
                        </div>

                        <div class="detail-section" v-if="selectedBill.description">
                            <h3>Summary</h3>
                            <div class="prose">{{ selectedBill.description }}</div>
                        </div>

                        <div class="detail-section">
                            <h3>Chambers</h3>
                            <div class="chambers-grid">
                                <template v-for="ch in ['house', 'senate']" :key="ch">
                                <div class="chamber-card" v-if="selectedBill[ch]">
                                    <h4>{{ ch === 'house' ? 'House' : 'Senate' }} — {{ selectedBill[ch].bill_number }}</h4>
                                    <span v-if="fileStage(ch)" class="stage-badge" :style="{ '--stage-color': STAGES[fileStage(ch)].color }">{{ fileStageLabel(ch) }}</span>
                                    <div v-if="selectedBill[ch].description">{{ selectedBill[ch].description }}</div>

                                    <div class="field-label">Authors</div>
                                    <div class="authors-list">
                                        <span class="author-chip" v-for="a in selectedBill[ch].authors" :key="a.name">
                                            <a v-if="a.url" :href="a.url" target="_blank" rel="noopener">{{ a.name }}</a>
                                            <template v-else>{{ a.name }}</template>
                                        </span>
                                    </div>

                                    <div class="field-label" v-if="selectedBill[ch].companion_url">Companion</div>
                                    <div v-if="selectedBill[ch].companion_url">
                                        <a :href="selectedBill[ch].companion_url" target="_blank" rel="noopener">{{ selectedBill[ch].companion_url }}</a>
                                    </div>

                                    <div class="field-label">Actions</div>
                                    <ul class="actions-timeline">
                                        <li v-for="(a, i) in chamberActions(selectedBill[ch], ch)" :key="i">
                                            <span class="action-date">{{ a.date }}</span>
                                            <span class="action-text">
                                                {{ a.text }}
                                                <a v-if="a.version_link" :href="a.version_link" target="_blank" rel="noopener">[version]</a>
                                            </span>
                                        </li>
                                    </ul>

                                    <div class="field-label" v-if="selectedBill[ch].url">Full record</div>
                                    <div v-if="selectedBill[ch].url">
                                        <a :href="selectedBill[ch].url" target="_blank" rel="noopener">{{ selectedBill[ch].url }}</a>
                                    </div>
                                </div>
                                </template>
                            </div>
                        </div>

                        <div class="detail-section" v-if="hasBillText">
                            <h3>Bill Text</h3>
                            <div class="bill-text-tabs">
                                <template v-for="ch in ['house', 'senate']" :key="ch">
                                <button
                                    v-if="selectedBill[ch] && selectedBill[ch].bill_text"
                                    class="bill-text-tab"
                                    :class="{ active: activeTextChamber === ch }"
                                    @click="activeTextChamber = ch"
                                >{{ ch === 'house' ? 'House' : 'Senate' }} text</button>
                                </template>
                            </div>
                            <div class="diff-box" v-if="activeBillText">
                                <div class="diff-box-header">
                                    <span>{{ activeBillText.version_label }} · posted {{ activeBillText.posted_date }}</span>
                                    <div class="diff-legend"><span class="swatch del"></span> removed</div>
                                    <div class="diff-legend"><span class="swatch add"></span> added</div>
                                </div>
                                <div class="diff-content" v-html="renderBillText(activeBillText.text_with_changes)"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <footer>Minnesota Explained — Bills Explorer</footer>
    </div>

    <script>
        const { createApp } = Vue;

        function initDarkMode() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        initDarkMode();

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // "MM/DD/YYYY" -> sortable "YYYYMMDD" ('' if missing)
        function sortableDate(d) {
            const m = /^(\d\d)\/(\d\d)\/(\d{4})/.exec(d || '');
            return m ? m[3] + m[1] + m[2] : '';
        }

        const PAGE_SIZE = 50;

        // Stage metadata; keys match build_data.py
        const STAGES = {
            committee:      { label: 'In committee',              short: 'In committee',       color: '#8a99ad' },
            floor:          { label: 'On the floor',              short: 'On the floor',       color: '#5b9bd5' },
            passed_origin:  { label: 'Passed first chamber',      short: 'Passed 1 chamber',   color: '#667eea' },
            second_chamber: { label: 'In second chamber',         short: 'In 2nd chamber',     color: '#8b6fe0' },
            passed_second:  { label: 'Passed both chambers',      short: 'Passed both',        color: '#b265d6' },
            reconcile:      { label: 'Concurrence / conference',  short: 'Reconciling',        color: '#d1609e' },
            governor:       { label: 'Sent to governor',          short: 'At governor',        color: '#e0a93b' },
            law:            { label: 'Signed into law',           short: 'Law',                color: '#3fb27f' },
            vetoed:         { label: 'Vetoed',                    short: 'Vetoed',             color: '#e05252' },
            replaced:       { label: 'Replaced by companion',     short: 'Replaced',           color: '#6b7a90' },
            folded:         { label: 'Folded into another bill',  short: 'Folded in',          color: '#c08a3e' },
        };
        const STAGE_ORDER = Object.keys(STAGES);

        const PARTIES = ['DFL', 'R'];
        const PARTY_COLORS = { DFL: '#4a8fe7', R: '#e05a5a' };

        // Hex seat map: odd-r pointy-top layout from data/committees.json (see scrape_committees.py)
        const HEX_ROW = Math.sqrt(3) / 2, HEX_R = 1 / Math.sqrt(3);
        function hexPoints(x, y, rad) {
            return [30, 90, 150, 210, 270, 330].map(a => {
                const t = a * Math.PI / 180;
                return `${(x + rad * Math.cos(t)).toFixed(3)},${(y + rad * Math.sin(t)).toFixed(3)}`;
            }).join(' ');
        }
        const HEX_ICON = hexPoints(0, 0, 0.95);
        const LEAD_RANK = { 'Chair': 0, 'Co-Chair': 0, 'Vice Chair': 1, 'Co-Vice Chair': 1, 'Ranking Minority Member': 2, 'Republican Lead': 2, 'DFL Lead': 2 };

        const BOARD_COLUMNS = ['Committee', 'Floor vote', 'Passed', 'Other chamber', 'Passed other', 'Reconcile', 'Governor', 'Enacted'];

        // Each cell = (lane, column) -> a cell key "<lane>:<stage>"
        const BOARD_LANES = [
            { id: 'house', label: 'House', sub: '134 members', cells: {
                1: { key: 'house:committee',      stage: 'committee',      label: 'House Files in committee', sub: 'reported' },
                2: { key: 'house:floor',          stage: 'floor',          label: 'House Files on the floor' },
                3: { key: 'house:passed_origin',  stage: 'passed_origin',  label: 'Passed House, not yet in Senate' },
                4: { key: 'house:second_chamber', stage: 'second_chamber', label: 'Senate Files in the House' },
                5: { key: 'house:passed_second',  stage: 'passed_second',  label: 'Senate Files passed by House' },
            } },
            { id: 'senate', label: 'Senate', sub: '67 members', cells: {
                1: { key: 'senate:committee',      stage: 'committee',      label: 'Senate Files in committee', sub: 'reported' },
                2: { key: 'senate:floor',          stage: 'floor',          label: 'Senate Files on the floor' },
                3: { key: 'senate:passed_origin',  stage: 'passed_origin',  label: 'Passed Senate, not yet in House' },
                4: { key: 'senate:second_chamber', stage: 'second_chamber', label: 'House Files in the Senate' },
                5: { key: 'senate:passed_second',  stage: 'passed_second',  label: 'House Files passed by Senate' },
            } },
            { id: 'both', label: 'Both chambers', sub: 'Concurrence or conference', cells: {
                6: { key: 'both:reconcile', stage: 'reconcile', label: 'Reconciling differences' },
            } },
            { id: 'gov', label: 'Governor', sub: 'Sign or veto', cells: {
                7: { key: 'gov:governor', stage: 'governor', label: 'Awaiting governor' },
                8: { key: 'gov:law',      stage: 'law',      label: 'Signed into law' },
            } },
        ];

        const OFFRAMP_CELLS = [
            { key: 'off:replaced', stage: 'replaced', label: 'Replaced by companion', sub: 'The other chamber\'s version moved forward instead' },
            { key: 'off:folded',   stage: 'folded',   label: 'Folded into another bill', sub: 'Content rolled into an omnibus or other bill' },
            { key: 'off:vetoed',   stage: 'vetoed',   label: 'Vetoed', sub: 'Rejected by the governor' },
        ];

        const ALL_CELLS = {};
        BOARD_LANES.forEach(l => Object.values(l.cells).forEach(c => { ALL_CELLS[c.key] = c; }));
        OFFRAMP_CELLS.forEach(c => { ALL_CELLS[c.key] = c; });

        function fileCellKey(file) {
            const st = file.st;
            if (!st) return null;
            const origin = file.ch;
            const other = origin === 'house' ? 'senate' : 'house';
            if (st === 'committee' || st === 'floor' || st === 'passed_origin') return `${origin}:${st}`;
            if (st === 'second_chamber' || st === 'passed_second') return `${other}:${st}`;
            if (st === 'reconcile') return 'both:reconcile';
            if (st === 'governor' || st === 'law') return `gov:${st}`;
            return `off:${st}`;
        }

        createApp({
            data() {
                return {
                    STAGES, BOARD_COLUMNS, BOARD_LANES, OFFRAMP_CELLS, PARTIES, HEX_ICON,

                    bills: [],
                    view: 'list',
                    loading: true,
                    error: null,

                    search: '',
                    sessionFilter: '',
                    chamberFilter: '',
                    stageFilter: '',
                    authorFilter: '',
                    page: 1,

                    pipelineSession: '',
                    selectedCell: '',
                    cellPage: 1,

                    legislators: [],
                    legLoading: false,
                    legError: null,
                    legChamber: 'house',
                    legSearch: '',
                    legParty: '',
                    legSortKey: 'chief',
                    legSortDir: -1,

                    cm: null,
                    cmLoading: false,
                    cmError: null,
                    cmChamber: 'house',
                    cmSel: '',          // selected committee id ('h94001') or seat key ('house:12A')
                    cmSearch: '',
                    cmHoverKey: '',
                    cmTipPos: { x: 0, y: 0 },

                    selectedBill: null,
                    detailLoading: false,
                    detailError: null,
                    activeTextChamber: 'house',
                };
            },
            computed: {
                sessions() {
                    return [...new Set(this.bills.map(b => b.session))].sort();
                },
                stageOptions() {
                    const present = new Set(this.bills.map(b => b.stage).filter(Boolean));
                    return STAGE_ORDER.filter(s => present.has(s));
                },
                billsByRn() {
                    const m = {};
                    this.bills.forEach(b => { m[b.revisor_number] = b; });
                    return m;
                },
                lastActionDate() {
                    let best = '', label = '';
                    this.bills.forEach(b => {
                        const d = b.latest_action && b.latest_action.date;
                        const s = sortableDate(d);
                        if (s > best) { best = s; label = d; }
                    });
                    return label;
                },
                filteredBills() {
                    let list = this.bills;

                    if (this.sessionFilter) {
                        list = list.filter(b => b.session === this.sessionFilter);
                    }

                    if (this.chamberFilter === 'house') {
                        list = list.filter(b => b.house_bill && !b.senate_bill);
                    } else if (this.chamberFilter === 'senate') {
                        list = list.filter(b => b.senate_bill && !b.house_bill);
                    } else if (this.chamberFilter === 'both') {
                        list = list.filter(b => b.house_bill && b.senate_bill);
                    }

                    if (this.stageFilter) {
                        list = list.filter(b => b.stage === this.stageFilter);
                    }

                    if (this.authorFilter) {
                        list = list.filter(b => b.author_keys.includes(this.authorFilter));
                    }

                    const q = this.search.trim().toLowerCase();
                    if (q) {
                        list = list.filter(b => {
                            if (b.revisor_number.toLowerCase().includes(q)) return true;
                            if (b.description && b.description.toLowerCase().includes(q)) return true;
                            if (b.bill_numbers.some(n => n.toLowerCase().includes(q))) return true;
                            if (b.authors.some(a => a.toLowerCase().includes(q))) return true;
                            return false;
                        });
                    }

                    return list;
                },
                totalPages() {
                    return Math.max(1, Math.ceil(this.filteredBills.length / PAGE_SIZE));
                },
                pagedBills() {
                    const start = (this.page - 1) * PAGE_SIZE;
                    return this.filteredBills.slice(start, start + PAGE_SIZE);
                },

                // --- Pipeline ---
                pipelineFiles() {
                    const out = [];
                    this.bills.forEach(b => {
                        if (this.pipelineSession && b.session !== this.pipelineSession) return;
                        b.files.forEach(f => {
                            const key = fileCellKey(f);
                            if (key) out.push({ bill: b, file: f, key });
                        });
                    });
                    return out;
                },
                cellCounts() {
                    const counts = {}, reported = {};
                    this.pipelineFiles.forEach(({ file, key }) => {
                        counts[key] = (counts[key] || 0) + 1;
                        if (file.cr) reported[key] = (reported[key] || 0) + 1;
                    });
                    return { counts, reported };
                },
                maxCellCount() {
                    return Math.max(1, ...Object.values(this.cellCounts.counts));
                },
                cellFiles() {
                    if (!this.selectedCell) return [];
                    return this.pipelineFiles
                        .filter(f => f.key === this.selectedCell)
                        .sort((a, b) => sortableDate(b.bill.latest_action && b.bill.latest_action.date)
                            .localeCompare(sortableDate(a.bill.latest_action && a.bill.latest_action.date)));
                },
                cellPages() {
                    return Math.max(1, Math.ceil(this.cellFiles.length / PAGE_SIZE));
                },
                pagedCellFiles() {
                    const start = (this.cellPage - 1) * PAGE_SIZE;
                    return this.cellFiles.slice(start, start + PAGE_SIZE);
                },

                // --- Legislators ---
                legislatorsByKey() {
                    const m = {};
                    this.legislators.forEach(l => { m[l.key] = l; });
                    return m;
                },
                chamberLegislators() {
                    return this.legislators
                        .filter(l => l.chamber === this.legChamber)
                        .map(l => ({ ...l, total: l.chief + l.coauthor }));
                },
                partySummary() {
                    // Totals per party for the selected chamber
                    const by = {};
                    this.chamberLegislators.forEach(l => {
                        if (!l.party) return;
                        const p = by[l.party] || (by[l.party] = { party: l.party, members: 0, chief: 0, law: 0 });
                        p.members++;
                        p.chief += l.chief;
                        p.law += l.chief_law;
                    });
                    return Object.values(by)
                        .sort((a, b) => b.members - a.members)
                        .map(p => ({ ...p, perMember: (p.chief / p.members).toFixed(1) }));
                },
                maxChief() {
                    return Math.max(1, ...this.chamberLegislators.map(l => l.chief));
                },
                sortedLegislators() {
                    const q = this.legSearch.trim().toLowerCase();
                    const key = this.legSortKey, dir = this.legSortDir;
                    return this.chamberLegislators
                        .filter(l => !this.legParty || l.party === this.legParty)
                        .filter(l => !q
                            || l.name.toLowerCase().includes(q)
                            || (l.full_name || '').toLowerCase().includes(q)
                            || (l.district || '').toLowerCase() === q)
                        .sort((a, b) => {
                            const av = a[key] ?? '', bv = b[key] ?? '';
                            const c = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
                            return c * dir || b.chief - a.chief || a.name.localeCompare(b.name);
                        });
                },

                // --- Committees ---
                cmById() {
                    const m = {};
                    (this.cm ? this.cm.committees : []).forEach(c => { m[c.id] = c; });
                    return m;
                },
                cmSelCommittee() {
                    return this.cmById[this.cmSel] || null;
                },
                cmSelSeat() {
                    return (this.cm && this.cm.seats[this.cmSel]) || null;
                },
                // district -> role on the selected committee
                cmRoles() {
                    const m = {};
                    if (this.cmSelCommittee) this.cmSelCommittee.members.forEach(x => { m[x.district] = x.role; });
                    return m;
                },
                cmTiles() {
                    if (!this.cm || !this.cm.tiles) return [];
                    const layout = this.cm.tiles[this.cmChamber];
                    return Object.keys(layout).sort().map(d => {
                        const [c, r] = layout[d];
                        const x = c + (r % 2 ? 0.5 : 0), y = r * HEX_ROW;
                        const key = `${this.cmChamber}:${d}`;
                        return { key, d, x: x.toFixed(3), y: y.toFixed(3), cx: x, cy: y,
                                 label: d.replace(/^0/, ''), seat: this.cm.seats[key],
                                 points: hexPoints(x, y, HEX_R * 0.95) };
                    });
                },
                cmViewBox() {
                    const xs = this.cmTiles.map(t => t.cx), ys = this.cmTiles.map(t => t.cy);
                    const x0 = Math.min(...xs) - 0.7, y0 = Math.min(...ys) - 0.7;
                    return `${x0} ${y0} ${Math.max(...xs) + 0.7 - x0} ${Math.max(...ys) + 0.7 - y0}`;
                },
                cmChamberSeats() {
                    if (!this.cm) return [];
                    return Object.entries(this.cm.seats).filter(([k]) => k.startsWith(this.cmChamber + ':')).map(([, s]) => s);
                },
                cmSeatTotal() {
                    return this.cmChamber === 'house' ? 134 : 67;
                },
                cmPartySeats() {
                    const n = {};
                    this.cmChamberSeats.forEach(s => { n[s.party] = (n[s.party] || 0) + 1; });
                    return Object.keys(n).sort((a, b) => (PARTIES.indexOf(a) + 1 || 9) - (PARTIES.indexOf(b) + 1 || 9))
                        .map(party => ({ party, n: n[party] }));
                },
                cmChamberCommittees() {
                    return this.cm ? this.cm.committees.filter(c => c.chamber === this.cmChamber) : [];
                },
                cmFiltered() {
                    const q = this.cmSearch.trim().toLowerCase();
                    return this.cmChamberCommittees
                        .filter(c => !q || c.name.toLowerCase().includes(q) || c.members.some(m => m.name.toLowerCase().includes(q)))
                        .sort((a, b) => a.name.localeCompare(b.name));
                },
                cmAvgSize() {
                    const cs = this.cmChamberCommittees.filter(c => c.kind === 'committee');
                    return cs.length ? (cs.reduce((t, c) => t + c.members.length, 0) / cs.length).toFixed(0) : '—';
                },
                cmAvgLoad() {
                    const ss = this.cmChamberSeats;
                    return ss.length ? (ss.reduce((t, s) => t + s.committees.length, 0) / ss.length).toFixed(1) : '—';
                },
                cmTip() {
                    if (!this.cmHoverKey) return null;
                    const t = this.cmTiles.find(x => x.key === this.cmHoverKey);
                    // Only show the floating tip while the pointer is over the map
                    if (!t || !this.cmTipPos.fromMap) return null;
                    return { ...t, role: this.cmRoles[t.d] };
                },
                cmScrapedAt() {
                    return this.cm ? new Date(this.cm.scraped_at).toLocaleDateString('en-US', { dateStyle: 'medium' }) : '';
                },

                // --- Detail ---
                hasBillText() {
                    if (!this.selectedBill) return false;
                    return !!((this.selectedBill.house && this.selectedBill.house.bill_text) ||
                              (this.selectedBill.senate && this.selectedBill.senate.bill_text));
                },
                activeBillText() {
                    if (!this.selectedBill) return null;
                    const ch = this.selectedBill[this.activeTextChamber];
                    return ch ? ch.bill_text : null;
                },
            },
            watch: {
                search() { this.page = 1; },
                sessionFilter() { this.page = 1; },
                chamberFilter() { this.page = 1; },
                stageFilter() { this.page = 1; },
                authorFilter() { this.page = 1; },
                pipelineSession() { this.cellPage = 1; },
            },
            async created() {
                try {
                    const response = await fetch('./data/bills_index.json');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    this.bills = await response.json();
                } catch (err) {
                    this.error = err.message;
                    console.error('Error loading bills_index.json:', err);
                } finally {
                    this.loading = false;
                }
                this.loadLegislators();
                window.addEventListener('hashchange', () => this.route());
                this.route();
            },
            methods: {
                // --- Routing: #bills, #pipeline, #legislators, #bill/<revisor number> ---
                go(path) {
                    if (location.hash === '#' + path) this.route();
                    else location.hash = path;
                },
                goBack() {
                    if (history.length > 1) history.back();
                    else this.go('bills');
                },
                route() {
                    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
                    if (h.startsWith('bill/')) {
                        this.openBill(h.slice(5));
                    } else if (h === 'pipeline') {
                        this.view = 'pipeline';
                    } else if (h === 'legislators') {
                        this.view = 'legislators';
                    } else if (h === 'committees' || h.startsWith('committees/')) {
                        // #committees, #committees/<chamber>, #committees/<committee id>, #committees/<chamber>:<district>
                        this.view = 'committees';
                        this.loadCommittees().then(() => this.cmRoute(h.slice(11)));
                    } else {
                        this.view = 'list';
                        this.selectedBill = null;
                    }
                },

                // --- Pipeline ---
                laneCell(lane, col) {
                    return lane.cells[col] || null;
                },
                cellCount(key) {
                    return this.cellCounts.counts[key] || 0;
                },
                cellSub(cell) {
                    if (cell.sub === 'reported') {
                        const n = this.cellCounts.reported[cell.key] || 0;
                        return `${n.toLocaleString()} cleared at least one committee`;
                    }
                    return cell.sub;
                },
                cellStyle(cell) {
                    const n = this.cellCount(cell.key);
                    // sqrt scale so small stages stay visible next to the huge committee pile
                    const fill = n ? 0.08 + 0.32 * Math.sqrt(n / this.maxCellCount) : 0;
                    return { '--stage-color': STAGES[cell.stage].color, '--fill': fill.toFixed(3) };
                },
                cellLabel(key) {
                    const c = ALL_CELLS[key];
                    if (!c) return key;
                    const lane = BOARD_LANES.find(l => key.startsWith(l.id + ':'));
                    return lane && !c.label.includes(lane.label) ? `${lane.label}: ${c.label}` : c.label;
                },
                selectCell(key) {
                    this.selectedCell = this.selectedCell === key ? '' : key;
                    this.cellPage = 1;
                },
                companionOf(f) {
                    const other = f.bill.files.find(x => x.n !== f.file.n);
                    return other ? other.n : null;
                },

                // --- Legislators ---
                async loadLegislators() {
                    if (this.legislators.length || this.legLoading) return;
                    this.legLoading = true;
                    try {
                        const response = await fetch('./data/legislators.json');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        this.legislators = await response.json();
                    } catch (err) {
                        this.legError = err.message;
                        console.error('Error loading legislators.json:', err);
                    } finally {
                        this.legLoading = false;
                    }
                },
                legCount(chamber) {
                    return this.legislators.filter(l => l.chamber === chamber).length;
                },
                sortLeg(key) {
                    if (this.legSortKey === key) {
                        this.legSortDir = -this.legSortDir;
                    } else {
                        this.legSortKey = key;
                        this.legSortDir = key === 'name' || key === 'party' ? 1 : -1;
                    }
                },
                sortArrow(key) {
                    if (this.legSortKey !== key) return '';
                    return this.legSortDir === 1 ? '▲' : '▼';
                },
                showAuthor(key) {
                    this.authorFilter = key;
                    this.search = '';
                    this.stageFilter = '';
                    this.go('bills');
                },
                legislatorLabel(key) {
                    const l = this.legislatorsByKey[key];
                    if (!l) return key;
                    const tag = [l.party, l.district].filter(Boolean).join('-');
                    return `${l.chamber === 'house' ? 'Rep.' : 'Sen.'} ${l.name}${tag ? ` (${tag})` : ''}`;
                },
                partyColor(p) {
                    return PARTY_COLORS[p] || 'var(--text-tertiary)';
                },

                // --- Committees ---
                loadCommittees() {
                    // One shared request, so a route change mid-load still waits for the data
                    if (!this.cmLoadPromise) this.cmLoadPromise = this.fetchCommittees();
                    return this.cmLoadPromise;
                },
                async fetchCommittees() {
                    this.cmLoading = true;
                    try {
                        const response = await fetch('./data/committees.json');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        this.cm = await response.json();
                    } catch (err) {
                        this.cmError = err.message;
                        console.error('Error loading committees.json:', err);
                    } finally {
                        this.cmLoading = false;
                    }
                },
                cmRoute(arg) {
                    this.cmHoverKey = '';
                    if (arg === 'house' || arg === 'senate') {
                        this.cmChamber = arg;
                        this.cmSel = '';
                        return;
                    }
                    const c = this.cmById[arg];
                    const seatChamber = /^(house|senate):/.exec(arg);
                    if (c) this.cmChamber = c.chamber;
                    else if (seatChamber && this.cm && this.cm.seats[arg]) this.cmChamber = seatChamber[1];
                    this.cmSel = c || (seatChamber && this.cm && this.cm.seats[arg]) ? arg : '';
                },
                cmCommitteeCount(chamber) {
                    return this.cm ? this.cm.committees.filter(c => c.chamber === chamber).length : 0;
                },
                cmIsLead(t) {
                    const role = this.cmRoles[t.d];
                    return !!role && role in LEAD_RANK;
                },
                cmTileClass(t) {
                    return {
                        off: !!this.cmSelCommittee && !this.cmRoles[t.d],
                        picked: this.cmSel === t.key || this.cmHoverKey === t.key,
                    };
                },
                cmHover(t, e) {
                    this.cmHoverKey = t.key;
                    this.cmMoveTip(e);
                },
                cmUnhover() {
                    this.cmHoverKey = '';
                    this.cmTipPos = { ...this.cmTipPos, fromMap: false };
                },
                cmMoveTip(e) {
                    // Keep the tooltip on screen (assume ~280x110)
                    const w = 290, h = 120;
                    this.cmTipPos = {
                        x: e.clientX + 14 + w > window.innerWidth ? e.clientX - w - 14 : e.clientX + 14,
                        y: e.clientY + 14 + h > window.innerHeight ? e.clientY - h - 14 : e.clientY + 14,
                        fromMap: true,
                    };
                },
                cmCommitteeParties(c) {
                    const n = {};
                    c.members.forEach(m => { n[m.party] = (n[m.party] || 0) + 1; });
                    return Object.keys(n).sort((a, b) => (PARTIES.indexOf(a) + 1 || 9) - (PARTIES.indexOf(b) + 1 || 9))
                        .map(party => ({ party, n: n[party] }));
                },
                cmRosterGroups(c) {
                    const lead = c.members.filter(m => m.role in LEAD_RANK);
                    const rest = c.members.filter(m => !(m.role in LEAD_RANK));
                    return [
                        { label: 'Leadership', members: lead },
                        { label: 'Members', members: rest },
                    ].filter(g => g.members.length);
                },
                cmChairLine(c) {
                    const chairs = c.members.filter(m => LEAD_RANK[m.role] === 0);
                    if (!chairs.length) return 'No chair listed';
                    const label = chairs.length > 1 ? 'Co-chairs' : 'Chair';
                    return `${label}: ${chairs.map(m => `${m.name} (${m.party})`).join(', ')}`;
                },
                cmSearchHits(c) {
                    const q = this.cmSearch.trim().toLowerCase();
                    if (!q || c.name.toLowerCase().includes(q)) return '';
                    const hits = c.members.filter(m => m.name.toLowerCase().includes(q));
                    return hits.length ? hits.map(m => m.name).join(', ') + (hits.length === 1 ? ' is a member' : ' are members') : '';
                },
                cmSeatCommittees(seat) {
                    return seat.committees.map(id => {
                        const c = this.cmById[id];
                        const me = c.members.find(m => m.district === seat.district);
                        return { id, name: c.name, role: me ? me.role : 'Member', rank: me && me.role in LEAD_RANK ? LEAD_RANK[me.role] : 9 };
                    }).sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name));
                },
                // Loose name match so 'Wayne Johnson' == 'Wayne A. Johnson'
                cmSamePerson(a, b) {
                    const parts = n => n.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(Boolean);
                    const pa = parts(a), pb = parts(b);
                    return pa[0] === pb[0] && pa[pa.length - 1] === pb[pb.length - 1];
                },

                // --- Detail ---
                fileStage(ch) {
                    const b = this.selectedBill && this.billsByRn[this.selectedBill.revisor_number];
                    const f = b && b.files.find(x => x.ch === ch);
                    return f ? f.st : null;
                },
                fileStageLabel(ch) {
                    const st = this.fileStage(ch);
                    if (st === 'passed_origin') return ch === 'house' ? 'Passed House' : 'Passed Senate';
                    if (st === 'second_chamber') return ch === 'house' ? 'In the Senate' : 'In the House';
                    return STAGES[st].label;
                },
                async openBill(revisorNumber) {
                    this.view = 'detail';
                    this.detailLoading = true;
                    this.detailError = null;
                    this.selectedBill = null;
                    try {
                        const response = await fetch(`./data/bills/${encodeURIComponent(revisorNumber)}.json`);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const bill = await response.json();
                        this.selectedBill = bill;
                        this.activeTextChamber = bill.house && bill.house.bill_text ? 'house' : 'senate';
                    } catch (err) {
                        this.detailError = err.message;
                        console.error('Error loading bill detail:', err);
                    } finally {
                        this.detailLoading = false;
                    }
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                chamberActions(chamberData, chamberKey) {
                    if (!chamberData || !chamberData.actions) return [];
                    const label = chamberKey === 'house' ? 'House' : 'Senate';
                    return chamberData.actions[label] || [];
                },
                renderBillText(text) {
                    if (!text) return '';
                    let html = escapeHtml(text);
                    html = html.replace(/\[\+([\s\S]*?)\+\]/g, '<ins>$1</ins>');
                    html = html.replace(/\[-([\s\S]*?)-\]/g, '<del>$1</del>');
                    return html;
                },
                toggleDarkMode() {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>

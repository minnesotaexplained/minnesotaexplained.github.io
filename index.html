                        "id":2,
                        "title":"Minneapolis City Government",
                        "description":"Learn about the city branches of government and their responsibilities.",
                        "subtitle":"",
                        "footer":"",
                        "category": "Minneapolis Government",
                        "type":"link",
                        "image":"/img/city.jpg",
                        "link":"/mplsgov.html"
                    },
                ]


                console.error('Error loading data:', error);
            }
        }

        // Channel Component
        const Channel = {
            name: 'Channel',
            props: {
                items: {
                    type: Array,
                    required: true
                },
                category: {
                    type: String,
                    required: true
                }
            },
            template: `
                <div class="category-section">
                    <h2 class="category-title">{{ category }}</h2>
                    <div class="cards-grid" v-if="filteredItems.length > 0">
                        <div 
                            v-for="item in filteredItems" 
                            :key="item.id"
                            class="card"
                            v-bind:style="{ backgroundImage: 'url(' + item.image + ')' }"
                            @click="navigateToItem(item)"
                        >
                            <h2 class="card-title">{{ item.title }}</h2>
                            <div class="card-description">{{ item.description }}</div>
                            <div class="card-link">View Details</div>
                        </div>
                    </div>
                    <div v-else class="empty-state">
                        <h3>No items found</h3>
                        <p>There are no items in the "{{ category }}" category.</p>
                    </div>
                </div>
            `,
            computed: {
                filteredItems() {
                    return this.items.filter(item => item.category === this.category);
                }
            },
            methods: {
                navigateToItem(item) {
                    if(item.link){
                        location.assign(item.link);
                    } else {
                        console.log(item)
                        console.log(item.id)
                        this.$router.push({ name: "page", params: { id: item.id }});
                    }
                }
            }
        };

        // Map Component
        const MapComponent = {
            name: 'MapComponent',
            props: {
                items: {
                    type: Array,
                    required: true
                }
            },
            template: `
                <div class="map-container">
                    <div class="map-wrapper">
                        <div id="map"></div>
                    </div>
                </div>
            `,
            mounted() {
                this.initMap();
            },
            watch: {
                items: {
                    handler() {
                        this.updateMarkers();
                    },
                    deep: true
                }
            },
            methods: {
                initMap() {
                    // Initialize the map
                    this.map = L.map('map').setView([20, 0], 2);

                    // Add tile layer
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 18
                    }).addTo(this.map);

                    // Add markers
                    this.updateMarkers();
                },
                updateMarkers() {
                    if (!this.map) return;

                    // Clear existing markers
                    if (this.markers) {
                        this.markers.forEach(marker => marker.remove());
                    }
                    this.markers = [];

                    // Add new markers
                    this.items.forEach(item => {
                        if (item.coordinates && Array.isArray(item.coordinates) && item.coordinates.length === 2) {
                            const marker = L.marker(item.coordinates).addTo(this.map);
                            
                            // Add popup with item information
                            const popupContent = `
                                <h4>${item.title || 'Location'}</h4>
                                <p>${item.description || ''}</p>
                                ${item.category ? `<span style="background: var(--accent); padding: 0.25rem 0.5rem; font-weight: 700; font-size: 0.75rem;">${item.category}</span>` : ''}
                            `;
                            marker.bindPopup(popupContent);
                            
                            this.markers.push(marker);
                        }
                    });

                    // Fit bounds to show all markers if there are any
                    if (this.markers.length > 0) {
                        const group = L.featureGroup(this.markers);
                        this.map.fitBounds(group.getBounds().pad(0.1));
                    }
                }
            },
            beforeUnmount() {
                if (this.map) {
                    this.map.remove();
                }
            }
        };

        // Home Page Component
        const HomePage = {
            name: 'HomePage',
            components: {
                Channel,
                MapComponent
            },
            data() {
                categories = [...new Set(ITEMS.map(obj => obj.category))];
                categories.sort();
                categories = moveToFront(categories, "ICE Resource Guide");
                return {
                    items: ITEMS,
                    categories: categories
                }
            },
            template: `
                <div class="cards-container">
                    <div id="intro" style="margin-bottom:50px">
                        <h2 class="card-title">Minnesota Explained</h2>
                        <p class="card-description">Minnesota Explained is a free guide to Minnesota state and Minneapolis city resources meant for residents.</p>
                    </div>
                    <div id="categoriesContainer">
                        <div v-for="cat in categories">
                            <channel :items="items" :category="cat"></channel>
                        </div>
                    </div>
                </div>
            `
        };

        // Table Component
        const TableComponent = {
            name: 'TableComponent',
            props: {
                data: {
                    type: Array,
                    required: true
                },
                columns: {
                    type: Array,
                    required: true
                },
                title: {
                    type: String,
                    default: 'Data Table'
                }
            },
            data() {
                return {
                    sortField: null,
                    sortDirection: 'asc', // 'asc' or 'desc'
                    filters: {} // Object to store filter values by field
                }
            },
            computed: {
                categoryColumns() {
                    return this.columns.filter(col => col.type === 'categories');
                },
                filteredData() {
                    let result = this.data;

                    // Apply all active filters
                    Object.keys(this.filters).forEach(field => {
                        const filterValue = this.filters[field];
                        if (filterValue && filterValue !== 'all') {
                            result = result.filter(item => {
                                const itemValue = item[field];

                                // Handle case-insensitive comparison
                                return itemValue.indexOf(filterValue) > -1
                            });
                        }
                    });

                    return result;
                },
                hasActiveFilters() {
                    return Object.values(this.filters).some(val => val && val !== 'all');
                },
                sortedData() {
                    let result = this.filteredData;

                    if (!this.sortField) {
                        return result;
                    }

                    return [...result].sort((a, b) => {
                        let aVal = a[this.sortField];
                        let bVal = b[this.sortField];

                        // Handle null/undefined
                        if (aVal == null) return 1;
                        if (bVal == null) return -1;

                        // Handle arrays (like coordinates) - convert to string for comparison
                        if (Array.isArray(aVal)) aVal = aVal.join(',');
                        if (Array.isArray(bVal)) bVal = bVal.join(',');

                        // Handle numbers
                        if (typeof aVal === 'number' && typeof bVal === 'number') {
                            return this.sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        }

                        // Handle strings (case-insensitive)
                        aVal = String(aVal).toLowerCase();
                        bVal = String(bVal).toLowerCase();

                        if (this.sortDirection === 'asc') {
                            return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
                        } else {
                            return aVal > bVal ? -1 : aVal < bVal ? 1 : 0;
                        }
                    });
                }
            },
            template: `
                <div class="table-container">
                    <div class="table-wrapper" style="overflow-y:auto;height:600px">
                        <table v-if="data.length > 0">
                            <thead>
                                <tr v-if="isMobile() == false" >
                                    <th
                                        v-for="column in columns" 
                                        :key="column.field"
                                        :style="{width:column.width}"
                                        :class="{
                                            'sortable': column.sortable,
                                            'sorted-asc': sortField === column.field && sortDirection === 'asc',
                                            'sorted-desc': sortField === column.field && sortDirection === 'desc'
                                        }"
                                        @click="column.sortable ? handleSort(column.field) : null"
                                    >

                                        <div>{{ column.header }}</div>
                                        <div v-if="column.type == 'categories'">
                                            <select 
                                                style="width:50px"
                                                class="filter-select"
                                                v-model="filters[column.field]"
                                                @change="handleFilterChange"
                                            >
                                                <option value="all">All {{ column.label }}</option>
                                                <option 
                                                    v-for="option in getUniqueValues(column.field)" 
                                                    :key="option"
                                                    :value="option"
                                                >
                                                    {{ formatValue(option, column) }}
                                                </option>
                                            </select>
                                        </div>
                                    </th>
                                </tr>
                                <tr v-if="isMobile() == true">
                                    <th>
                                        {{ data.title }}
                                    </th>
                                </tr>
                            </thead>
                            <tbody v-if="isMobile() == false">
                                <tr v-for="(row, index) in sortedData" :key="index">
                                    <td v-for="column in columns" :key="column.field">
                                        <a v-if="column.type == 'link'" :href="row[column.field]">
                                            {{ row[column.field] }}
                                        </a>
                                        <div class="category-tag" v-if="column.type == 'categories'" v-for="cat in row[column.field]">
                                            {{ cat }}
                                        </div>
                                        <div :class="{'bold':column.field == 'title'}" v-if="column.type != 'link' && column.type != 'categories'">
                                            {{ formatValue(row[column.field], column, index) }}
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                            <tbody v-if="isMobile() == true">
                                <tr v-for="(row, index) in sortedData" :key="index">
                                    <td>
                                        <div style="margin-bottom:10px" v-for="column in columns" :key="column.field">
                                            <a v-if="column.type == 'link'" :href="row[column.field]">
                                                {{ row[column.field] }}
                                            </a>
                                            <div class="category-tag" v-if="column.type == 'categories'">
                                                {{ formatValue(row[column.field], column, index) }}
                                            </div>
                                            <div :class="{'bold':column.field == 'title'}" v-if="column.type != 'link' && column.type != 'categories'">
                                                {{ formatValue(row[column.field], column, index) }}
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div v-else class="table-empty">
                            No data available
                        </div>
                    </div>
                </div>
            `,
            methods: {
                isMobile() {
                    return IS_MOBILE
                },
                getUniqueValues(field) {
                    let values = [];
                    for(let d of this.data){
                        for(let val of d[field]){
                            values.push(val)
                        }
                    }
                    return [...new Set(values)].filter(val => val != null).sort();
                },
                handleFilterChange() {
                    // Filters are automatically applied through computed properties
                },
                clearFilters() {
                    this.filters = {};
                },
                handleSort(field) {
                    if (this.sortField === field) {
                        // Toggle direction if clicking the same field
                        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        // New field, default to ascending
                        this.sortField = field;
                        this.sortDirection = 'asc';
                    }
                },
                formatValue(value, column, index) {

                    if(column.field == "index"){
                        return index + 1
                    }

                    // If column has a custom formatter function, use it
                    if (column.formatter && typeof column.formatter === 'function') {
                        return column.formatter(value);
                    }
                    
                    // Handle arrays (like coordinates)
                    if (Array.isArray(value)) {
                        return value.join(', ');
                    }
                    
                    // Handle null/undefined
                    if (value === null || value === undefined) {
                        return '-';
                    }
                    
                    return value;
                }
            }
        };

        // Detail Page Component
        const DetailPage = {
            name: 'DetailPage',
            components: {
                MapComponent,
                TableComponent
            },
            data(){
                return {
                    item:null
                }
            },
            async created(){
                let item;
                for(let i in ITEMS){
                    if(this.$route.params.id == ITEMS[i].id){
                        this.item = ITEMS[i]
                        break
                    }
                }
                if(this.item.src){
                    this.item.html = await fetchData(this.item.src)
                }
            },
            template: `
                <div class="container detail-page">
                    <router-link to="/" class="back-btn">Back</router-link>

                    <div class="detail-header">
                        <h2>{{ item.title }}</h2>
                    </div>

                    <div class="detail-content">
                        
                        <div style="margin-bottom:20px" v-if="item.map">
                            <map-component :items="item.data"></map-component>
                        </div>

                        <div v-if="item.columns">
                            <table-component 
                                :data="item.data" 
                                :columns="item.columns"
                                :title="item.title"
                            ></table-component>
                        </div>  

                        <div>
                            <div v-html="item.html"></div>
                        </div>
                    </div>
                </div>
            `,
        };

        // Router Configuration
        const routes = [
            {
                path: '/',
                component: HomePage
            },
            {
                name: 'page',
                path: '/page/:id?',
                component: DetailPage
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Create App
        const app = createApp({});

        async function load_app(){
            await loadData()
            app.use(router);
            app.mount('#app');    
        }
        load_app();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballot Endorsements</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* "Light" mode — semi-dark slate */
        :root {
            --bg-primary: #1e2433;
            --bg-secondary: #252d3d;
            --bg-tertiary: #2a3347;
            --text-primary: #dce4f0;
            --text-secondary: #90a4be;
            --text-tertiary: #6b82a0;
            --text-quaternary: #56708a;
            --border-primary: #2e3d55;
            --accent-primary: #5b9bd5;
            --accent-secondary: #1e3c72;
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
            --hover-bg: #253045;
        }

        /* Dark mode — deeper charcoal */
        [data-theme="dark"] {
            --bg-primary: #0f1117;
            --bg-secondary: #161b27;
            --bg-tertiary: #1a2030;
            --text-primary: #e2e8f0;
            --text-secondary: #8898aa;
            --text-tertiary: #637080;
            --text-quaternary: #4a5568;
            --border-primary: #1e2a3a;
            --accent-primary: #4299e1;
            --accent-secondary: #2b6cb0;
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
            --hover-bg: #161b27;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
            color: white;
            padding: 20px 40px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        [data-theme="dark"] .navbar {
            background: #0a0d14;
            border-bottom: 1px solid #1e2a3a;
        }

        .mx-logo {
            font-size: 0.8rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 5px 9px;
            flex-shrink: 0;
        }

        .mx-logo:hover { background: rgba(255, 255, 255, 0.3); }

        .navbar-content { flex: 1; }
        .navbar-title { font-size: 1.3em; font-weight: 700; margin: 0 0 5px 0; }
        .navbar-subtitle { font-size: 1em; opacity: 0.9; margin: 0; }

        .dark-mode-toggle { margin-left: auto; }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .toggle-slider::before { content: '☀️'; }
        [data-theme="dark"] .toggle-slider { transform: translateX(30px); }
        [data-theme="dark"] .toggle-slider::before { content: '🌙'; }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 30px 60px;
        }

        .page-intro { margin-bottom: 24px; }
        .page-intro h1 { font-size: 1.6rem; margin: 0 0 6px 0; }
        .page-intro p { color: var(--text-secondary); margin: 0 0 8px 0; line-height: 1.6; }
        .page-intro a { color: var(--accent-primary); }

        .office {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }

        .page-intro .coverage-warning {
            color: var(--text-primary);
            background: var(--bg-secondary);
            border-left: 3px solid #ecc94b;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
        }

        .voting-info {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-primary);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 14px 0 8px 0;
        }

        .voting-info h2 { font-size: 1.05rem; margin: 0 0 8px 0; }

        .voting-info ul {
            margin: 0 0 10px 0;
            padding-left: 18px;
            line-height: 1.6;
            font-size: 14.5px;
        }

        .page-intro .voting-link {
            display: inline-block;
            color: white;
            background: var(--accent-secondary);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .race-filters {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
            margin-bottom: 12px;
            background: var(--bg-primary);
            scrollbar-width: thin;
            scrollbar-color: var(--border-primary) transparent;
        }

        .race-filters::-webkit-scrollbar { height: 6px; }
        .race-filters::-webkit-scrollbar-track { background: transparent; }
        .race-filters::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }

        .filter-chip {
            flex-shrink: 0;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
        }

        .filter-chip:hover { border-color: var(--accent-primary); color: var(--text-primary); }

        .filter-chip.active {
            color: white;
            background: var(--accent-secondary);
            border-color: var(--accent-primary);
        }

        .chip-count {
            font-size: 11px;
            opacity: 0.75;
            margin-left: 2px;
        }

        .district-chip {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            border-radius: 999px;
            padding: 1px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .coverage {
            margin: 0 0 14px 0;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .coverage summary {
            cursor: pointer;
            color: var(--text-secondary);
        }

        .coverage ul {
            margin: 6px 0 0 0;
            padding-left: 18px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .coverage-note { margin: 6px 0 0 0; }

        .section-heading {
            margin: 36px 0 16px 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-primary);
        }

        .section-heading h2 { font-size: 1.3rem; margin: 0 0 6px 0; }
        .section-heading p { color: var(--text-secondary); margin: 0; line-height: 1.6; }

        .not-endorsed-office { opacity: 0.85; }

        .not-endorsed {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            border: 1px dashed var(--text-tertiary);
            border-radius: 999px;
            padding: 2px 10px;
        }

        .office-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            margin: 0 0 10px 0;
        }

        .office-note {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 12px 0;
        }

        .candidate {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .candidate + .candidate {
            border-top: 1px solid var(--border-primary);
            margin-top: 14px;
            padding-top: 14px;
        }

        .candidate-body {
            flex: 1;
            min-width: 0;
        }

        .headshot {
            width: 96px;
            height: 96px;
            border-radius: 10px;
            object-fit: cover;
            object-position: center 25%;
            flex-shrink: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
        }

        .integrity {
            font-size: 12px;
            font-weight: 700;
            border-radius: 999px;
            padding: 2px 10px;
            text-decoration: none;
            border: 1px solid currentColor;
        }

        .grade-a { color: #48bb78; }
        .grade-b { color: #ecc94b; }
        .grade-low { color: #f56565; }

        .analysis {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 8px 0 0 0;
            font-size: 14.5px;
        }

        .legislation {
            margin-top: 10px;
            font-size: 14px;
        }

        .legislation summary {
            cursor: pointer;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .legislation ul {
            margin: 8px 0 0 0;
            padding-left: 18px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .legislation li { margin-bottom: 6px; }

        .record-summary {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 8px 0 0 0;
        }

        .legislation a {
            color: var(--accent-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .bill-meta {
            display: block;
            color: var(--text-tertiary);
            font-size: 12.5px;
        }

        .candidate-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .party {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-primary);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 999px;
            padding: 2px 10px;
        }

        .description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 8px 0 0 0;
            white-space: pre-line;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .links a {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--accent-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }

        .links a:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        .status {
            text-align: center;
            color: var(--text-secondary);
            padding: 60px 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-quaternary);
            font-size: 13px;
            border-top: 1px solid var(--border-primary);
        }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .navbar-title { font-size: 1.15em; }
            .navbar-subtitle { font-size: 0.85em; }
            .container { padding: 0 16px 40px; }
            .office { padding: 16px; }
            .headshot { width: 64px; height: 64px; }
        }
    </style>
    <link rel="stylesheet" href="../css/navbar.css">
    <script src="../js/navbar.js"></script>
</head>
<body>
    <div id="app">
        <nav class="mx-nav" aria-label="Site">
            <a href="/" class="mx-nav-logo" title="Minnesota Explained home">MX</a>
            <div class="mx-nav-text">
                <div class="mx-nav-title">Ballot Endorsements</div>
                <div class="mx-nav-subtitle">Minnesota Explained<template v-if="ballot"> — {{ ballot.election }}, {{ ballot.election_date }}</template></div>
            </div>
            <button class="mx-nav-toggle" type="button" aria-label="Toggle dark mode"><span class="mx-nav-toggle-slider"></span></button>
        </nav>

        <div class="container">
            <div v-if="loading" class="status">Loading endorsements…</div>

            <div v-else-if="error" class="status">Could not load endorsements for district {{ district }} — {{ error }}</div>

            <template v-else>
                <div class="page-intro">
                    <h1>{{ ballot.title }}</h1>
                    <p v-if="ballot.intro" class="description">{{ ballot.intro }}</p>
                    <p v-if="ballot.coverage_note" class="coverage-warning">{{ ballot.coverage_note }}</p>
                    <aside v-if="ballot.voting_info" class="voting-info">
                        <h2>{{ ballot.voting_info.title }}</h2>
                        <ul>
                            <li v-for="item in ballot.voting_info.items" :key="item">{{ item }}</li>
                        </ul>
                        <a v-if="ballot.voting_info.link" :href="safeUrl(ballot.voting_info.link.url)"
                           target="_blank" rel="noopener" class="voting-link">{{ ballot.voting_info.link.label }} →</a>
                    </aside>
                    <p v-if="ballot.ballot_lookup_url">
                        Only races we endorse in are listed, plus judicial races at the bottom for information.
                        <a :href="ballot.ballot_lookup_url" target="_blank" rel="noopener">See your full ballot</a>
                        from the Minnesota Secretary of State.
                    </p>
                </div>

                <nav v-if="groups.length > 1" class="race-filters" aria-label="Filter by race">
                    <button type="button" class="filter-chip" :class="{ active: filter === 'all' }"
                            :aria-pressed="filter === 'all'" @click="filter = 'all'">All races</button>
                    <button v-for="g in groups" :key="g.key" type="button" class="filter-chip"
                            :class="{ active: filter === g.key }" :aria-pressed="filter === g.key"
                            @click="filter = g.key">
                        {{ g.label }} <span class="chip-count">{{ g.count }}</span>
                    </button>
                </nav>

                <div v-if="filter === 'all' && !sections[0].offices.length" class="status">No endorsements yet.</div>

                <template v-for="section in sections" :key="section.key">
                <div v-if="section.heading && section.offices.length" class="section-heading">
                    <h2>{{ section.heading }}</h2>
                    <p>{{ section.note }}</p>
                </div>
                <section v-for="office in section.offices" :key="office.office" class="office"
                         :class="{ 'not-endorsed-office': section.key === 'info' }">
                    <h2 class="office-title">
                        {{ office.office }}
                        <span v-if="office.coverage" class="district-chip">District race</span>
                    </h2>
                    <p v-if="office.note" class="office-note">{{ office.note }}</p>
                    <details v-if="office.coverage" class="coverage">
                        <summary>Who votes in this race: {{ office.coverage.summary }}</summary>
                        <p v-if="office.coverage.note" class="coverage-note">{{ office.coverage.note }}</p>
                        <ul>
                            <li v-for="w in office.coverage.wards" :key="w.ward">
                                <strong>Ward {{ w.ward }}:</strong>
                                {{ w.all ? 'all precincts' : (w.precincts.length === 1 ? 'precinct ' : 'precincts ') + w.precincts.join(', ') }}
                            </li>
                        </ul>
                    </details>

                    <div v-for="c in office.candidates" :key="c.name" class="candidate">
                        <img v-if="c.image && !brokenImages[c.image]" :src="safeUrl(c.image)" :alt="c.name"
                             class="headshot" loading="lazy" referrerpolicy="no-referrer"
                             @error="brokenImages[c.image] = true">
                        <div class="candidate-body">
                            <h3 class="candidate-name">
                                {{ c.name }}
                                <span v-if="c.party" class="party">{{ c.party }}</span>
                                <span v-if="c.endorsed === false" class="not-endorsed">Not endorsed</span>
                                <a v-if="c.integrity_index" :href="safeUrl(c.integrity_index.url)" target="_blank" rel="noopener"
                                   class="integrity" :class="gradeClass(c.integrity_index.grade)"
                                   :title="`Integrity Index score ${c.integrity_index.score} (as of ${c.integrity_index.as_of})`">
                                    Integrity {{ c.integrity_index.grade }} · {{ c.integrity_index.score }}
                                </a>
                            </h3>
                            <p v-if="c.description" class="description">{{ c.description }}</p>
                            <p v-if="c.analysis" class="analysis">{{ c.analysis }}</p>
                            <details v-if="c.legislation && c.legislation.length" class="legislation">
                                <summary>Legislation authored ({{ c.legislation.length }})</summary>
                                <ul>
                                    <li v-for="bill in c.legislation" :key="bill.bill">
                                        <a :href="safeUrl(bill.url)" target="_blank" rel="noopener">{{ bill.bill }}</a>
                                        {{ bill.title }}
                                        <span class="bill-meta">{{ bill.status }} · {{ bill.session }}</span>
                                    </li>
                                </ul>
                            </details>
                            <details v-if="c.board_record && c.board_record.items" class="legislation">
                                <summary>{{ c.board_record.title || 'Voting record' }} ({{ c.board_record.items.length }})</summary>
                                <p v-if="c.board_record.summary" class="record-summary">{{ c.board_record.summary }}</p>
                                <ul>
                                    <li v-for="item in c.board_record.items" :key="item.date + item.title">
                                        <a :href="safeUrl(item.url)" target="_blank" rel="noopener">{{ item.date }}</a>
                                        {{ item.title }}
                                        <span class="bill-meta">{{ item.action }} · {{ item.result }}</span>
                                    </li>
                                </ul>
                            </details>
                            <div v-if="c.links && c.links.length" class="links">
                                <a v-for="link in c.links" :key="link.url" :href="safeUrl(link.url)"
                                   :target="link.url.startsWith('/') ? null : '_blank'" rel="noopener">{{ link.label || link.url }}</a>
                            </div>
                        </div>
                    </div>
                </section>
                </template>
            </template>
        </div>

        <footer>Minnesota Explained — Ballot Endorsements</footer>
    </div>

    <script>
        const { createApp } = Vue;

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

        // Which ballot file to load: ?district=61A -> data/61A.json (default: Minneapolis)
        const DEFAULT_DISTRICT = 'MPLS';

        // Race types for the quick filters, in ballot order. An office can set
        // "group" in the JSON to override the match on its title.
        const RACE_GROUPS = [
            { key: 'us-senate', label: 'U.S. Senate', match: /^U\.S\. Senator/i },
            { key: 'us-house', label: 'U.S. House', match: /^U\.S\. Representative/i },
            { key: 'state-senate', label: 'State Senate', match: /^State Senator/i },
            { key: 'state-house', label: 'State House', match: /^State Representative/i },
            { key: 'governor', label: 'Governor', match: /^Governor/i },
            { key: 'sos', label: 'Secretary of State', match: /^Secretary of State/i },
            { key: 'auditor', label: 'State Auditor', match: /^State Auditor/i },
            { key: 'ag', label: 'Attorney General', match: /^Attorney General/i },
            { key: 'question', label: 'Ballot Question', match: /amendment|question/i },
            { key: 'commissioner', label: 'County Commissioner', match: /^County Commissioner/i },
            { key: 'sheriff', label: 'Sheriff', match: /Sheriff/i },
            { key: 'county-attorney', label: 'County Attorney', match: /^County Attorney/i },
            { key: 'school-board', label: 'School Board', match: /^School Board/i },
            { key: 'supreme-court', label: 'Supreme Court', match: /Supreme Court/i },
            { key: 'appeals', label: 'Court of Appeals', match: /Court of Appeals/i },
            { key: 'district-court', label: 'District Court', match: /District Court/i },
            { key: 'other', label: 'Other', match: /.*/ },
        ];

        function raceGroup(office) {
            return RACE_GROUPS.find(g => g.key === office.group)
                || RACE_GROUPS.find(g => g.match.test(office.office));
        }

        createApp({
            data() {
                return {
                    district: '',
                    ballot: null,
                    loading: true,
                    error: null,
                    brokenImages: {},
                    filter: 'all',
                };
            },
            computed: {
                // Races where every candidate was removed are hidden. A race goes in the
                // "for information" section when none of its candidates are endorsed
                // (candidate "endorsed": false; a missing field counts as endorsed).
                visibleOffices() {
                    return (this.ballot?.offices || []).filter(o => o.candidates && o.candidates.length);
                },
                // Quick-filter chips: one per race type present, in ballot order.
                groups() {
                    const counts = {};
                    for (const o of this.visibleOffices) {
                        const g = raceGroup(o);
                        counts[g.key] = (counts[g.key] || 0) + 1;
                    }
                    return RACE_GROUPS.filter(g => counts[g.key]).map(g => ({ ...g, count: counts[g.key] }));
                },
                sections() {
                    const offices = this.visibleOffices.filter(o => this.filter === 'all' || raceGroup(o).key === this.filter);
                    const isInfo = o => o.candidates.every(c => c.endorsed === false);
                    return [
                        { key: 'endorsed', offices: offices.filter(o => !isInfo(o)) },
                        {
                            key: 'info',
                            heading: 'Not endorsed: for your information',
                            note: this.ballot?.not_endorsed_note || 'We are not making endorsements in these races. Here is what we found about each candidate.',
                            offices: offices.filter(isInfo),
                        },
                    ];
                },
            },
            watch: {
                // Keep the chosen filter in the URL (?race=commissioner) so it can be shared.
                filter(value) {
                    const url = new URL(window.location.href);
                    if (value === 'all') url.searchParams.delete('race');
                    else url.searchParams.set('race', value);
                    history.replaceState(null, '', url);
                },
            },
            async mounted() {
                const params = new URLSearchParams(window.location.search);
                const param = params.get('district');
                this.district = (param || DEFAULT_DISTRICT).toUpperCase().replace(/[^0-9A-Z]/g, '');
                const race = params.get('race');
                if (race && RACE_GROUPS.some(g => g.key === race)) this.filter = race;
                try {
                    const response = await fetch(`./data/${this.district}.json`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    this.ballot = await response.json();
                    document.title = `${this.ballot.title} — Minnesota Explained`;
                    // If the page opened with a filter, bring its chip into view.
                    this.$nextTick(() => {
                        document.querySelector('.filter-chip.active')
                            ?.scrollIntoView({ inline: 'center', block: 'nearest' });
                    });
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },
            methods: {
                // Allow http(s) links and site-relative paths like /katiejones.html.
                safeUrl(url) {
                    return /^(https?:\/\/|\/(?!\/))/i.test(url || '') ? url : '#';
                },
                gradeClass(grade) {
                    const letter = (grade || '').charAt(0).toUpperCase();
                    return letter === 'A' ? 'grade-a' : letter === 'B' ? 'grade-b' : 'grade-low';
                },
            },
        }).mount('#app');
    </script>
</body>
</html>
